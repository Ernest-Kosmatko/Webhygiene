[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webhygiene"
version = "1.0.0"
description = "HTTP security header, cookie and TLS hygiene checker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ernest Kosmatko" }]
keywords = ["security", "pentest", "http-headers", "tls"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
webhygiene = "webhygiene.cli:main"

[tool.setuptools.packages.find]
include = ["webhygiene*"]
